<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172747"><meta name="description" content="Dein Wiederholungszähler beim Üben: gut gespielt zählt herunter, verspielt zählt herauf."><title>Finger &amp; Köpfchen · Dein Übe-Countdown</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23172c60'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='24' fill='white'%3E5%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main>
<header class="title-header"><span class="title-notes notes-before" aria-hidden="true"><span>♪</span><span>♫</span></span><div class="title-copy"><h1>Finger &amp; Köpfchen</h1><p class="title-subtitle">Dein Übe-Countdown</p></div><span class="title-notes notes-after" aria-hidden="true"><span>♫</span><span>♪</span></span></header>
<section class="practice" aria-label="Wiederholungen zählen">
<div class="counter-panel" id="panel"><div class="panel-toolbar"><button class="settings-toggle" id="settings-toggle" aria-expanded="false" aria-controls="settings">Startwert: <span id="goal-value">5</span> ⚙</button></div><div class="settings" id="settings" hidden aria-labelledby="goal-label"><div class="settings-heading"><h2 id="goal-label">Dein Startwert</h2><button type="button" class="close-settings" id="close-settings" aria-label="Einstellung schließen">✕</button></div><div class="goal-controls"><div class="presets" role="group" aria-label="Startwert auswählen"><button data-goal="5" aria-pressed="true">5</button><button data-goal="10" aria-pressed="false">10</button><button data-goal="15" aria-pressed="false">15</button></div><form id="custom-form"><label for="custom">Eigene Zahl</label><div class="input-wrap"><input id="custom" type="number" min="1" step="1" inputmode="numeric" placeholder="z. B. 8" required aria-describedby="error"><button aria-label="Eigenen Startwert übernehmen" type="submit">OK</button></div></form></div><p class="error" id="error" role="alert"></p></div><span class="eyebrow" id="eyebrow">NOCH</span><div class="number" id="count" role="status" aria-live="polite" aria-atomic="true" aria-label="Noch 5 richtige Wiederholungen">5</div><p id="caption">richtige Wiederholungen</p><div class="finish" id="finish">Einmal spielen. Dann antippen.</div><div class="celebration-lane" aria-hidden="true"><div class="celebration" id="celebration" hidden><span class="music-note note-left">♫</span><span class="clapping">👏</span><span class="music-note note-right">♪</span></div></div></div>
<div class="actions"><button class="mistake" id="mistake"><span class="sign" aria-hidden="true">+1</span><span>Verspielt<span class="button-note">Eine Wiederholung mehr</span></span></button><button class="good" id="good"><span class="sign" aria-hidden="true">−1</span><span>Gut gespielt<span class="button-note">Eine Wiederholung weniger</span></span><span class="symbol" aria-hidden="true">😊</span></button></div>
</section>
<div class="under-controls"><button class="reset" id="reset">↻ Neu starten</button><button class="sound" id="sound" aria-pressed="true" aria-label="Jubelton ausschalten">Ton an</button></div>
<footer>In deinem Tempo. Wiederholung für Wiederholung.</footer>
</main><div id="confetti" hidden aria-hidden="true"></div></body></html>
